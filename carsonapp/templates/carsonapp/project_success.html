{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Successful</title>
  <link rel="stylesheet" href="{% static 'carsonapp/css/test2_css.css' %}">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .success-container {
      background-color: white;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .success-container h1 {
      color: #28a745;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .success-container p {
      color: #333;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .success-container a {
      display: inline-block;
      padding: 0.7rem 1.5rem;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .success-container a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <h1>✅ Project Uploaded!</h1>
    <p>Your project has been successfully added.</p>
    <a href="{% url 'web-home' %}">Back to Home</a>
  </div>
</body>
</html>
